version: '3.8'

services:
  pce-boardview:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: pce-boardview
    ports:
      - "8001:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s